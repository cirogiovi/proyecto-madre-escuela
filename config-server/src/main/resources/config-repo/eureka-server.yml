server:
  port: 8761                     # Puerto estándar de Eureka

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false  # No necesita registrarse a sí mismo
    fetch-registry: false        # No necesita buscar un registro externo
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/